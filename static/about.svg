<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340">
    <rect width="400" height="340" fill="#fff8f5"/>
    <ellipse cx="200" cy="315" rx="160" ry="18" fill="#ffe3ec"/>

    <!-- ХВОСТ -->
    <g>
        <animateTransform attributeName="transform" type="rotate"
            values="-30 130 250; 30 130 250; -30 130 250"
            dur="0.35s" repeatCount="indefinite"/>
        <path d="M155 250 Q105 265 85 225 Q75 195 100 185 Q122 180 140 210 Q150 230 155 250 Z"
              fill="#e8b667" stroke="#c99a4a" stroke-width="2"/>
    </g>

    <!-- тело сидя -->
    <path d="M150 260 Q140 180 200 170 Q260 180 260 260 Q260 290 200 290 Q150 290 150 260 Z"
          fill="#f2c879"/>
    <ellipse cx="205" cy="255" rx="45" ry="30" fill="#ffe4b5"/>

    <!-- передние лапы -->
    <ellipse cx="180" cy="290" rx="16" ry="10" fill="#d9a559"/>
    <ellipse cx="225" cy="290" rx="16" ry="10" fill="#d9a559"/>

    <!-- голова -->
    <circle cx="205" cy="120" r="68" fill="#f2c879"/>
    <ellipse cx="205" cy="155" rx="42" ry="32" fill="#ffe4b5"/>

    <!-- уши -->
    <ellipse cx="155" cy="100" rx="26" ry="48" fill="#d9a559" transform="rotate(-20 155 100)"/>
    <ellipse cx="255" cy="100" rx="26" ry="48" fill="#d9a559" transform="rotate(20 255 100)"/>

    <!-- глаза -->
    <circle cx="182" cy="118" r="10" fill="#3a2410"/>
    <circle cx="228" cy="118" r="10" fill="#3a2410"/>
    <circle cx="185" cy="114" r="3.5" fill="#fff"/>
    <circle cx="231" cy="114" r="3.5" fill="#fff"/>

    <!-- нос, рот -->
    <ellipse cx="205" cy="148" rx="12" ry="9" fill="#3a2410"/>
    <path d="M205 158 Q198 172 185 168" stroke="#3a2410" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M205 158 Q212 172 225 168" stroke="#3a2410" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- язычок -->
    <ellipse cx="205" cy="172" rx="9" ry="11" fill="#ff8ea3"/>

    <!-- сердечко над головой -->
    <g>
        <animateTransform attributeName="transform" type="translate"
            values="0 0; 0 -8; 0 0" dur="1.5s" repeatCount="indefinite"/>
        <path d="M280 50 C280 40 295 40 295 52 C295 40 310 40 310 50 C310 65 295 75 295 80 C295 75 280 65 280 50 Z"
              fill="#ff6b9d"/>
    </g>
</svg>