<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
    <rect width="400" height="320" fill="#fff8f5"/>
    <ellipse cx="200" cy="290" rx="180" ry="22" fill="#ffe3ec"/>

    <!-- ХВОСТ -->
    <g>
        <animateTransform attributeName="transform" type="rotate"
            values="-25 130 220; 25 130 220; -25 130 220"
            dur="0.4s" repeatCount="indefinite"/>
        <path d="M150 220 Q100 235 80 195 Q68 165 95 155 Q115 152 132 180 Q140 200 150 220 Z"
              fill="#e8b667" stroke="#c99a4a" stroke-width="2"/>
    </g>

    <!-- туловище -->
    <ellipse cx="230" cy="220" rx="95" ry="58" fill="#f2c879"/>
    <ellipse cx="230" cy="235" rx="75" ry="38" fill="#ffe4b5"/>

    <!-- лапы -->
    <ellipse cx="170" cy="272" rx="20" ry="12" fill="#d9a559"/>
    <ellipse cx="230" cy="276" rx="22" ry="13" fill="#d9a559"/>
    <ellipse cx="295" cy="272" rx="20" ry="12" fill="#d9a559"/>

    <!-- голова -->
    <circle cx="305" cy="175" r="62" fill="#f2c879"/>
    <ellipse cx="322" cy="195" rx="34" ry="26" fill="#ffe4b5"/>

    <!-- уши -->
    <ellipse cx="265" cy="150" rx="22" ry="42" fill="#d9a559" transform="rotate(-15 265 150)"/>
    <ellipse cx="345" cy="150" rx="22" ry="42" fill="#d9a559" transform="rotate(15 345 150)"/>

    <!-- глаз -->
    <circle cx="325" cy="168" r="7" fill="#3a2410"/>
    <circle cx="327" cy="165" r="2.5" fill="#fff"/>
    <circle cx="285" cy="168" r="7" fill="#3a2410"/>
    <circle cx="287" cy="165" r="2.5" fill="#fff"/>

    <!-- нос + язык -->
    <ellipse cx="335" cy="200" rx="8" ry="6" fill="#3a2410"/>
    <ellipse cx="335" cy="218" rx="7" ry="9" fill="#ff8ea3"/>

    <!-- мячик с анимацией (подпрыгивает) -->
    <g>
        <animateTransform attributeName="transform" type="translate"
            values="0 0; 0 -18; 0 0" dur="0.9s" repeatCount="indefinite"/>
        <circle cx="100" cy="255" r="26" fill="#ff6b9d"/>
        <path d="M74 255 Q100 235 126 255" stroke="#fff" stroke-width="3" fill="none"/>
        <path d="M74 255 Q100 275 126 255" stroke="#fff" stroke-width="3" fill="none"/>
    </g>

    <!-- бантик -->
    <g transform="translate(352 130) rotate(10)">
        <path d="M0 0 L-16 -10 L-16 10 Z" fill="#ff6b9d"/>
        <path d="M0 0 L16 -10 L16 10 Z" fill="#ff6b9d"/>
        <circle cx="0" cy="0" r="4" fill="#e91e63"/>
    </g>
</svg>